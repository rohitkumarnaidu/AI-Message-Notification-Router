title: AI Message Notification Router
description: Enterprise-grade AI system for intelligent WhatsApp message routing with multimodal analysis and deterministic safety guarantees.
remote_theme: just-the-docs/just-the-docs@v0.10.0

url: "https://rohitkumarnaidu.github.io"
baseurl: "/AI-Message-Notification-Router"

color_scheme: dark

aux_links:
  "GitHub Repository":
    - "https://github.com/rohitkumarnaidu/AI-Message-Notification-Router"

aux_links_new_tab: true

nav_sort: case_insensitive

heading_anchors: true

search_enabled: true
search:
  heading_level: 3
  previews: 3

footer_content: "Built with ❤️ by <a href=\"https://github.com/rohitkumarnaidu\">Rohit Kumar Naidu</a>. Licensed under MIT."

plugins:
  - jekyll-remote-theme

exclude:
  - node_modules
  - frontend
  - code
  - tests
  - dataset
  - evidence
  - outputs
  - artifacts
  - scripts
  - reports
